<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeakUp AI — Real-Time Public Speaking Coach</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #050508;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .font-cyber { font-family: 'Orbitron', sans-serif; }

    /* Smooth Fade Transitions */
    .page-view {
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .page-hidden {
      opacity: 0;
      pointer-events: none;
      position: absolute;
      inset: 0;
      transform: scale(0.985);
    }
    .page-visible {
      opacity: 1;
      pointer-events: auto;
      position: relative;
      transform: scale(1);
    }

    /* Page 1: Rich Warm Acoustic Wood & Theater Backdrop */
    .auditorium-bg {
      background:
        radial-gradient(ellipse at 50% 18%, rgba(255, 196, 107, 0.16) 0%, rgba(72, 36, 14, 0.22) 38%, rgba(6, 5, 5, 0.98) 82%),
        linear-gradient(180deg, #160c06 0%, #0b0705 60%, #050404 100%);
      min-height: 100vh;
    }

    /* Subtle Floating & Glowing Mic Animation */
    @keyframes floatMic {
      0%, 100% { transform: translateY(-5px); }
      50% { transform: translateY(5px); }
    }
    .mic-trigger {
      animation: floatMic 2.6s ease-in-out infinite;
      transform-origin: center;
      cursor: pointer;
    }
    .mic-glow {
      filter: drop-shadow(0 0 8px #22d3ee) drop-shadow(0 0 18px rgba(34, 211, 238, 0.85));
      transition: filter 0.3s ease;
    }
    .mic-trigger:hover .mic-glow {
      filter: drop-shadow(0 0 12px #38bdf8) drop-shadow(0 0 28px #a855f7);
    }

    /* Page 2: Cosmic Galaxy & Twinkling Stars */
    .cosmic-bg {
      background:
        radial-gradient(circle at 18% 22%, rgba(168, 85, 247, 0.32) 0%, transparent 45%),
        radial-gradient(circle at 82% 28%, rgba(59, 130, 246, 0.3) 0%, transparent 48%),
        radial-gradient(circle at 50% 82%, rgba(236, 72, 153, 0.24) 0%, transparent 50%),
        linear-gradient(135deg, #040210 0%, #0c0624 50%, #05081a 100%);
      min-height: 100vh;
      position: relative;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 9999px;
      animation: twinkle var(--dur, 3s) ease-in-out infinite;
      opacity: 0.75;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* Cyberpunk Glass Cards */
    .cyber-card {
      background: rgba(11, 15, 32, 0.74);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(34, 211, 238, 0.28);
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.08);
    }
    .cyber-card:hover {
      border-color: rgba(34, 211, 238, 0.6);
    }
  </style>
</head>
<body>

  <!-- ==================== PAGE 1: HIGH-DEF AUDITORIUM LANDING ==================== -->
  <div id="page-auditorium" class="page-view page-visible auditorium-bg flex flex-col justify-between">
    <!-- Top Header -->
    <header class="max-w-6xl w-full mx-auto px-6 py-5 flex items-center justify-between">
      <div class="flex items
